name: Sheet sync (SDR / GTM open roles)

on:
  schedule:
    # 11:30 UTC = 3:30 am Pacific (4:30 during daylight time), ahead of the
    # 5:46 am morning brief. GitHub can start scheduled runs a little late.
    - cron: "30 11 * * *"
  workflow_dispatch: {}   # "Run workflow" button on the Actions tab

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-sync.txt
      - run: pip install -r requirements-sync.txt
      - name: Sync open roles into the Companies tab
        env:
          SHEET_ID: ${{ secrets.SHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: python sheet_sync.py tracks/sdr_gtm.yaml
